[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "karthik-dataviz-mcp"
version = "0.1.0"
description = "Colour, precision, scale, and chart-reading helpers for Karthik's dataviz skills"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "Pillow>=11,<13",
]

[project.scripts]
karthik-dataviz-mcp = "dataviz_mcp.server:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["dataviz_mcp*"]

[tool.pytest.ini_options]
testpaths = ["dataviz_mcp/tests"]
